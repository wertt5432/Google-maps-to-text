<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Formatter</title>
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--text:#28251d;--muted:#7a7974;--primary:#01696f;--primaryHover:#0c4e54;--inverse:#f9f8f4;--border:#d4d1ca;--shadow:0 4px 12px rgba(0,0,0,.08);--r:16px;--space:16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}
    [data-theme="dark"]{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--text:#cdccca;--muted:#979591;--primary:#4f98a3;--primaryHover:#227f8b;--inverse:#2b2a28;--border:#393836;--shadow:0 4px 12px rgba(0,0,0,.3)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top right, color-mix(in oklab,var(--primary) 12%,transparent), transparent 30%),var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px} .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
    .brand{font-weight:800} .toggle{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:999px}
    .hero,.panel{background:color-mix(in oklab,var(--surface) 92%,white 8%);border:1px solid color-mix(in oklab,var(--text) 10%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:24px;margin-bottom:20px} h1{margin:0 0 10px;font-size:clamp(1.8rem,4vw,3rem);line-height:1.05} p{margin:0;color:var(--muted)}
    .card{padding:22px} label{display:block;font-weight:700;margin:0 0 8px} textarea{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:14px;resize:vertical;font:inherit}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0} button,a.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
    .primary{background:var(--primary);color:var(--inverse)} .secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)} .secondary:hover,.primary:hover{filter:brightness(.95)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px} .box{min-height:260px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);overflow-wrap:anywhere}
    .plain{white-space:pre-wrap} .list{display:grid;gap:10px} .link{display:block;padding:12px 14px;border-radius:12px;background:color-mix(in oklab,var(--primary) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--primary) 24%,transparent);color:var(--primary);text-decoration:none;font-weight:700}
    .kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:4px}.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.95rem}
    .help{margin-top:14px;padding:14px;border-radius:12px;background:color-mix(in oklab,var(--primary) 6%,var(--surface));border:1px solid color-mix(in oklab,var(--primary) 18%,transparent);color:var(--muted)}
    @media (max-width:860px){.hero,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">Route Formatter</div>
      <button class="toggle" id="themeBtn" type="button">Theme</button>
    </header>


    <section class="hero">
      <div>
        <h1>Turn a Google Maps route into Apple Maps links.</h1>
        <p>Paste a Google Maps directions URL. The app extracts each stop, shows plain text, and creates tappable Apple Maps links for iPhone.</p>
      </div>
      <div class="card" style="background:linear-gradient(180deg,color-mix(in oklab,var(--primary) 8%,var(--surface)) 0%,var(--surface) 100%)">
        <strong style="display:block;margin-bottom:10px">Example</strong>
        <div style="display:grid;gap:10px">
          <div class="box" style="min-height:auto;padding:12px">Tap links open Apple Maps</div>
        </div>
      </div>
    </section>


    <section class="panel card">
      <label for="routeInput">Google route link</label>
      <textarea id="routeInput" placeholder="Paste a Google Maps directions URL here..."></textarea>
      <div class="actions">
        <button class="primary" id="extractBtn" type="button">Extract stops</button>
        <button class="secondary" id="copyTextBtn" type="button">Copy plain text</button>
        <button class="secondary" id="copyLinksBtn" type="button">Copy Apple Maps links</button>
        <button class="secondary" id="clearBtn" type="button">Clear</button>
      </div>
      
      <div class="grid" style="margin-top:18px">
        <div>
          <label>Plain text result</label>
          <div id="output" class="box plain" aria-live="polite"></div>
        </div>
        <div>
          <label>Apple Maps links</label>
          <div id="linkOutput" class="box" aria-live="polite"></div>
        </div>
      </div>
      <div class="meta"><span id="countMeta">Stops: 0</span><span id="statusMeta">Ready.</span></div>
    </section>
  </div>


  <script>
    const input = document.getElementById('routeInput');
    const output = document.getElementById('output');
    const linkOutput = document.getElementById('linkOutput');
    const countMeta = document.getElementById('countMeta');
    const statusMeta = document.getElementById('statusMeta');
    const themeBtn = document.getElementById('themeBtn');


    function safeDecode(s){try{return decodeURIComponent(s.replace(/\+/g,' '))}catch{return s.replace(/\+/g,' ')}}
    function normalizeStop(s){return s.replace(/^\s+|\s+$/g,'').replace(/\s{2,}/g,' ').replace(/\s+,/g,',').replace(/,(?=[^\s])/g,', ').trim()}
    function extractStops(text){const source=text.trim();if(!source)return[];const m=source.match(/\/maps\/dir\/([^?#]+)/i);const path=m?m[1]:source;return path.split('/').map(safeDecode).map(s=>s.trim()).filter(Boolean).filter(s=>!s.startsWith('@')).filter(s=>!/^data=!/i.test(s)).filter(s=>!/^!/.test(s)).filter(s=>!/^https?:/i.test(s)).filter(s=>!/^www\./i.test(s)).filter(s=>!/^dir$/i.test(s)).filter(s=>!/^maps$/i.test(s)).filter(s=>!/^place$/i.test(s)).filter(s=>!/^search$/i.test(s)).filter(s=>!/^preview$/i.test(s)).filter(s=>!/^\d+z$/i.test(s)).filter(s=>!s.includes('!3m')&&!s.includes('!4m')&&!s.includes('!1m')).map(normalizeStop).filter(Boolean)}
    function appleUrl(stop){return `https://maps.apple.com/?q=${encodeURIComponent(stop)}`}
    function render(stops){output.textContent=stops.join('\n\n');linkOutput.innerHTML='';if(!stops.length){linkOutput.textContent='No links yet.'}else{const list=document.createElement('div');list.className='list';stops.forEach((stop,i)=>{const a=document.createElement('a');a.className='link';a.href=appleUrl(stop);a.target='_blank';a.rel='noopener noreferrer';a.innerHTML=`<span class="kicker">Stop ${i+1}</span>${stop}`;list.appendChild(a)});linkOutput.appendChild(list)}countMeta.textContent=`Stops: ${stops.length}`;statusMeta.textContent=stops.length?'Apple Maps links ready.':'No valid route stops found.'}
    function extractNow(){render(extractStops(input.value))}
    document.getElementById('extractBtn').onclick=extractNow
    document.getElementById('copyTextBtn').onclick=async()=>{const t=output.textContent.trim();if(!t)return statusMeta.textContent='Nothing to copy yet.';try{await navigator.clipboard.writeText(t);statusMeta.textContent='Plain text copied.'}catch{statusMeta.textContent='Clipboard copy failed.'}}
    document.getElementById('copyLinksBtn').onclick=async()=>{const t=extractStops(input.value).map(appleUrl).join('\n');if(!t)return statusMeta.textContent='No links to copy yet.';try{await navigator.clipboard.writeText(t);statusMeta.textContent='Apple Maps links copied.'}catch{statusMeta.textContent='Clipboard copy failed.'}}
    document.getElementById('clearBtn').onclick=()=>{input.value='';output.textContent='';linkOutput.textContent='';countMeta.textContent='Stops: 0';statusMeta.textContent='Cleared.'}
    let theme='dark';document.documentElement.setAttribute('data-theme',theme);themeBtn.onclick=()=>{theme=theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',theme)}
  </script>
</body>
</html>
